name: Mutation testing

# Opt-in: runs on main pushes and manual dispatch. Not a required check for PRs
# because a full run on helpers.py + sensor_entities.py takes 10–20 min.
# The job uploads the raw mutmut results as an artifact; the Mutation Score and
# the top surviving functions surface in the job summary.
#
# The final step gates the job against `.mutmut-baseline`: if the total survivor
# count or any tracked per-function cap regresses, the main-branch run fails.
# To lower the baseline after a mutation lane kills survivors, re-run
# `python .github/scripts/mutation_score_gate.py --results mutation-results.txt
# --baseline .mutmut-baseline --write-baseline` locally and commit the diff.

on:
  push:
    branches: ["main"]
    paths:
      - "custom_components/onekommafive/helpers.py"
      - "custom_components/onekommafive/sensor_entities.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation score (helpers + sensor_entities)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[test-integration,test-mutation]"

      - name: Run mutmut
        run: mutmut run || true  # non-zero exit is expected when mutants survive

      - name: Dump results
        if: always()
        run: mutmut results | tee mutation-results.txt

      - name: Upload mutmut results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results
          path: mutation-results.txt
          retention-days: 30

      - name: Score gate + summary
        if: always()
        run: |
          python .github/scripts/mutation_score_gate.py \
            --results mutation-results.txt \
            --baseline .mutmut-baseline \
            --write-summary >> "$GITHUB_STEP_SUMMARY"
