name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Run pytest
        run: pytest tests/test_helpers.py tests/test_translations.py -v --cov=custom_components/onekommafive --cov-report=term-missing

  integration-tests:
    name: Integration tests (HA stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install integration test dependencies
        run: pip install -e ".[test-integration]"

      - name: Run integration pytest
        run: pytest tests/integration -v

  lint:
    name: Lint (ruff via pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
