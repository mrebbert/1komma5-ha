name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Run pytest
        run: pytest tests/test_helpers.py tests/test_translations.py -v --cov=custom_components/onekommafive/helpers --cov-report=term-missing --cov-fail-under=95

  integration-tests:
    name: Integration tests (HA stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install integration test dependencies
        run: pip install -e ".[test-integration]"

      # Runs Tier-2 plus the Tier-1 helpers/translations tests so the
      # coverage report reflects the full picture (Tier-1 covers `helpers.py`
      # branches HA never touches, e.g. naive-timestamp parsing).
      - name: Run integration pytest
        run: pytest tests -v --cov=custom_components/onekommafive --cov-report=term-missing --cov-fail-under=95

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Needs the HA stack installed so mypy can resolve homeassistant.* types.
      - name: Install typecheck dependencies
        run: pip install -e ".[test-integration,typecheck]"

      - name: Run mypy
        run: mypy

  lint:
    name: Lint (ruff via pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
