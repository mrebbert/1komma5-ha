name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly scan on Saturday at 06:30 UTC
    - cron: "30 6 * * 6"

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # queries + filters live together so the exclude reliably applies.
          # py/unused-import: false-positives on PEP 695 generic subscripts in
          # class bases (e.g. `CoordinatorEntity[C]`); ruff F401 covers unused
          # imports accurately in the lint job, so this quality query is dropped.
          config: |
            queries:
              - uses: security-and-quality
            query-filters:
              - exclude:
                  id: py/unused-import

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
