get_cheapest_window:
  fields:
    duration_minutes:
      required: true
      example: 120
      selector:
        number:
          min: 15
          max: 1800
          step: 15
          unit_of_measurement: min
          mode: slider
    earliest_start:
      example: "2026-04-26T22:00:00"
      selector:
        datetime:
    latest_end:
      example: "2026-04-27T07:00:00"
      selector:
        datetime:
    config_entry_id:
      selector:
        config_entry:
          integration: onekommafive

get_most_expensive_window:
  fields:
    duration_minutes:
      required: true
      example: 120
      selector:
        number:
          min: 15
          max: 1800
          step: 15
          unit_of_measurement: min
          mode: slider
    earliest_start:
      example: "2026-04-26T15:00:00"
      selector:
        datetime:
    latest_end:
      example: "2026-04-26T22:00:00"
      selector:
        datetime:
    config_entry_id:
      selector:
        config_entry:
          integration: onekommafive

import_history:
  fields:
    days_back:
      example: 30
      selector:
        number:
          min: 1
          max: 3650
          step: 1
          unit_of_measurement: d
          mode: box
    config_entry_id:
      selector:
        config_entry:
          integration: onekommafive

clear_history:
  fields:
    confirm:
      required: true
      example: true
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: onekommafive
