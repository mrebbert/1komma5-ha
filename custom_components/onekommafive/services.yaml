get_cheapest_window:
  fields:
    duration_minutes:
      required: true
      example: 120
      selector:
        number:
          min: 15
          max: 1800
          step: 15
          unit_of_measurement: min
          mode: slider
    earliest_start:
      example: "2026-04-26T22:00:00"
      selector:
        datetime:
    latest_end:
      example: "2026-04-27T07:00:00"
      selector:
        datetime:
    config_entry_id:
      selector:
        config_entry:
          integration: onekommafive

get_most_expensive_window:
  fields:
    duration_minutes:
      required: true
      example: 120
      selector:
        number:
          min: 15
          max: 1800
          step: 15
          unit_of_measurement: min
          mode: slider
    earliest_start:
      example: "2026-04-26T15:00:00"
      selector:
        datetime:
    latest_end:
      example: "2026-04-26T22:00:00"
      selector:
        datetime:
    config_entry_id:
      selector:
        config_entry:
          integration: onekommafive

refresh_now:
  fields:
    coordinator:
      default: live
      example: live
      selector:
        select:
          options:
            - live
            - price
            - optimization
            - weather
            - system_status
            - energy
            - notifications
            - all
    config_entry_id:
      selector:
        config_entry:
          integration: onekommafive

get_heartbeat_metrics:
  fields:
    window:
      required: true
      example: month
      selector:
        select:
          options:
            - day
            - week
            - month
            - half_year
            - year
    config_entry_id:
      selector:
        config_entry:
          integration: onekommafive

assign_ev_to_wallbox:
  fields:
    wallbox_id:
      required: true
      example: "5f8c9b2e-1234-4a5b-9c8d-1a2b3c4d5e6f"
      selector:
        text:
    ev_id:
      required: true
      example: "e7d3f412-abcd-4321-8765-fedcba098765"
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: onekommafive
