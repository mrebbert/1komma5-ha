views:
  - type: sections
    path: ''
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Netz- und PV-Leistung
            heading_style: title
            icon: mdi:transmission-tower
          - type: gauge
            entity: sensor.SYSTEM_NAME_grid_power
            max: 13000
            needle: true
            severity:
              green: -7000
              yellow: 0
              red: 2500
            min: -7000
            grid_options:
              columns: 6
              rows: auto
          - type: gauge
            entity: sensor.SYSTEM_NAME_pv_power
            grid_options:
              columns: 6
              rows: auto
            needle: true
            max: 6880
          - type: gauge
            entity: sensor.SYSTEM_NAME_battery_power
            min: -7200
            max: 7200
            severity:
              green: 3500
              yellow: 0
              red: -7200
            grid_options:
              columns: 6
              rows: auto
            needle: true
          - type: gauge
            entity: sensor.SYSTEM_NAME_battery_soc
            needle: true
            severity:
              green: 75
              yellow: 25
              red: 0
            grid_options:
              columns: 6
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Verbrauch
            heading_style: title
            icon: mdi:home-lightning-bolt-outline
          - type: gauge
            entity: sensor.SYSTEM_NAME_consumption_power
            max: 15000
            grid_options:
              columns: 12
              rows: auto
            needle: true
            severity:
              green: 0
              yellow: 1000
              red: 5000
          - type: gauge
            entity: sensor.SYSTEM_NAME_household_power
            grid_options:
              columns: 3
              rows: auto
            max: 3600
            name: Haushalt
          - type: gauge
            entity: sensor.SYSTEM_NAME_heat_pumps_power
            grid_options:
              columns: 3
              rows: auto
            name: Wärmepumpe
            max: 3500
          - type: gauge
            entity: sensor.SYSTEM_NAME_ev_chargers_power
            max: 11000
            grid_options:
              columns: 3
              rows: auto
            name: Wallbox
          - type: gauge
            entity: sensor.SYSTEM_NAME_acs_power
            name: Klimaanlage
            grid_options:
              columns: 3
              rows: auto
      - type: grid
        cards:
          - type: heading
            icon: mdi:chart-box-outline
            heading: Energiebezug und -einspeisung - täglich
            heading_style: title
          - chart_type: bar
            period: day
            type: statistics-graph
            entities:
              - entity: sensor.SYSTEM_NAME_pv_power_energy
                name: PV
              - entity: sensor.SYSTEM_NAME_grid_consumption_power_energy
                name: Netzbezug
              - entity: sensor.SYSTEM_NAME_grid_feed_in_power_energy
                name: Einspeisung
            stat_types:
              - change
            grid_options:
              columns: 12
              rows: 5
            days_to_show: 7
          - type: heading
            icon: mdi:calendar-today
            heading: Energiebezug und -einspeisung - Heute
            heading_style: title
          - type: statistic
            entity: sensor.SYSTEM_NAME_grid_consumption_power_energy
            period:
              calendar:
                period: day
            stat_type: change
            grid_options:
              columns: 12
              rows: 2
            name: Netzbezug
          - type: statistic
            entity: sensor.SYSTEM_NAME_pv_power_energy
            period:
              calendar:
                period: day
            stat_type: change
            name: PV
          - type: statistic
            entity: sensor.SYSTEM_NAME_grid_feed_in_power_energy
            period:
              calendar:
                period: day
            stat_type: change
            name: Einspeisung
      - type: grid
        cards:
          - type: heading
            icon: mdi:chart-box-outline
            heading: Energieverbrauch - täglich
            heading_style: title
          - chart_type: bar
            period: day
            type: statistics-graph
            entities:
              - entity: sensor.SYSTEM_NAME_consumption_power_energy
                name: Gesamt
              - entity: sensor.SYSTEM_NAME_household_power_energy
                name: Haushalt
              - entity: sensor.SYSTEM_NAME_ev_chargers_power_energy
                name: Wallbox
              - entity: sensor.SYSTEM_NAME_heat_pumps_power_energy
                name: Wärmepumpe
            stat_types:
              - change
            hide_legend: false
            logarithmic_scale: false
            days_to_show: 7
            grid_options:
              columns: 12
              rows: 5
          - type: heading
            icon: mdi:calendar-today
            heading: Energieverbrauch - Heute
            heading_style: title
          - type: statistic
            entity: sensor.SYSTEM_NAME_consumption_power_energy
            period:
              calendar:
                period: day
            stat_type: change
            name: Gesamt
          - type: statistic
            entity: sensor.SYSTEM_NAME_household_power_energy
            period:
              calendar:
                period: day
            stat_type: change
            name: Haushalt
          - type: statistic
            entity: sensor.SYSTEM_NAME_ev_chargers_power_energy
            period:
              calendar:
                period: day
            stat_type: change
            name: Wallbox
          - type: statistic
            entity: sensor.SYSTEM_NAME_heat_pumps_power_energy
            period:
              calendar:
                period: day
            stat_type: change
            name: Wärmepumpe
        column_span: 1
      - type: grid
        cards:
          - type: heading
            icon: mdi:calendar-month
            heading: Energiebezug und -einspeisung - monatlich
            heading_style: title
          - chart_type: bar
            period: month
            type: statistics-graph
            entities:
              - entity: sensor.SYSTEM_NAME_pv_power_energy
                name: PV
              - entity: sensor.SYSTEM_NAME_grid_consumption_power_energy
                name: Netzbezug
              - entity: sensor.SYSTEM_NAME_grid_feed_in_power_energy
                name: Einspeisung
            stat_types:
              - change
            grid_options:
              columns: 12
              rows: 5
            days_to_show: 7
          - type: heading
            heading: Energiebezug und -einspeisung - Monat
            heading_style: title
          - type: statistic
            entity: sensor.SYSTEM_NAME_grid_consumption_power_energy
            period:
              calendar:
                period: month
            stat_type: change
            grid_options:
              columns: 12
              rows: 2
            name: Netzbezug
          - type: statistic
            entity: sensor.SYSTEM_NAME_pv_power_energy
            period:
              calendar:
                period: month
            stat_type: change
            name: PV
          - type: statistic
            entity: sensor.SYSTEM_NAME_grid_feed_in_power_energy
            period:
              calendar:
                period: month
            stat_type: change
            name: Einspeisung
      - type: grid
        cards:
          - type: heading
            heading: Leistungs- und Einspeisungsverlauf (24h)
            heading_style: title
            icon: mdi:chart-areaspline
          - chart_type: line
            period: 5minute
            type: statistics-graph
            entities:
              - sensor.SYSTEM_NAME_grid_power
              - sensor.SYSTEM_NAME_battery_power
              - sensor.SYSTEM_NAME_pv_power
              - sensor.SYSTEM_NAME_consumption_power
            stat_types:
              - mean
            days_to_show: 1
            logarithmic_scale: false
            expand_legend: true
            grid_options:
              columns: 24
              rows: auto
        column_span: 2
      - type: grid
        cards:
          - type: heading
            icon: mdi:calendar-month
            heading: Energieverbrauch - monatlich
            heading_style: title
          - chart_type: bar
            period: month
            type: statistics-graph
            entities:
              - entity: sensor.SYSTEM_NAME_consumption_power_energy
                name: Gesamt
              - entity: sensor.SYSTEM_NAME_household_power_energy
                name: Haushalt
              - entity: sensor.SYSTEM_NAME_ev_chargers_power_energy
                name: Wallbox
              - entity: sensor.SYSTEM_NAME_heat_pumps_power_energy
                name: Wärmepumpe
            stat_types:
              - change
            hide_legend: false
            logarithmic_scale: false
            days_to_show: 7
            grid_options:
              columns: 12
              rows: 5
          - type: heading
            heading: Energieverbrauch - Monat
            heading_style: title
          - type: statistic
            entity: sensor.SYSTEM_NAME_consumption_power_energy
            period:
              calendar:
                period: month
            stat_type: change
            name: Gesamt
          - type: statistic
            entity: sensor.SYSTEM_NAME_household_power_energy
            period:
              calendar:
                period: month
            stat_type: change
            name: Haushalt
          - type: statistic
            entity: sensor.SYSTEM_NAME_ev_chargers_power_energy
            period:
              calendar:
                period: month
            stat_type: change
            name: Wallbox
          - type: statistic
            entity: sensor.SYSTEM_NAME_heat_pumps_power_energy
            period:
              calendar:
                period: month
            stat_type: change
            name: Wärmepumpe
    title: Netz
    icon: mdi:transmission-tower
    cards: []
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: switch.SYSTEM_NAME_ems_auto_mode
        name: EMS Automatik
        show_entity_picture: false
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.SYSTEM_NAME_self_sufficiency
        icon: mdi:sun-clock
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: binary_sensor.SYSTEM_NAME_cheap_electricity
        name:
          type: entity
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.SYSTEM_NAME_current_electricity_price
        show_entity_picture: false
    max_columns: 2
    dense_section_placement: true
  - type: sections
    max_columns: 4
    icon: mdi:car-electric
    path: ev
    sections:
      - type: grid
        cards:
          - type: entities
            entities:
              - entity: select.CAR_IDENTIFIER_lademodus
          - type: entities
            entities:
              - entity: number.CAR_IDENTIFIER_fahrzeug_akkustand_manuell
                name: Akkustand aktuell
              - entity: number.CAR_IDENTIFIER_ziel_akkustand
                name: Zielakkustand
              - entity: time.CAR_IDENTIFIER_abfahrtzeit
                name: tägliche Abfahrtzeit
            visibility:
              - condition: state
                entity: sensor.CAR_IDENTIFIER_lademodus
                state: SMART_CHARGE
        column_span: 1
  - type: sections
    max_columns: 2
    icon: mdi:currency-eur
    path: preise-und-kosten
    title: Preise und Kosten
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Dynamische Strompreise
            heading_style: title
            icon: mdi:cash-multiple
          - type: entity
            entity: sensor.cheapest_future_hour
            name: Günstigste Zeit
          - type: entity
            entity: sensor.cheapest_future_price
            name: Günstigster Preis
          - graph: line
            type: sensor
            entity: sensor.SYSTEM_NAME_current_electricity_price
            detail: 1
            name: Aktuell
          - graph: line
            type: sensor
            entity: sensor.SYSTEM_NAME_average_electricity_price
            detail: 1
            name: Durchschnitt
          - graph: line
            type: sensor
            entity: sensor.SYSTEM_NAME_lowest_electricity_price
            detail: 1
            name: Niedrigster
          - graph: line
            type: sensor
            entity: sensor.SYSTEM_NAME_highest_electricity_price
            detail: 1
            name: Höchster
      - type: grid
        cards:
          - type: heading
            icon: mdi:chart-bar
            heading: Strompreisentwicklung
            heading_style: title
          - type: custom:apexcharts-card
            graph_span: 30h
            span:
              start: hour
            now:
              show: true
              label: Jetzt
            header:
              show: true
              show_states: true
              colorize_states: true
            yaxis:
              - min: auto
                decimals: 4
            series:
              - entity: sensor.SYSTEM_NAME_current_electricity_price
                name: Strompreis
                unit: EUR/kWh
                float_precision: 4
                type: column
                data_generator: |
                  return entity.attributes.forecast.map(e => [
                    new Date(e.start).getTime(),
                    e.price
                  ]);
                color_threshold:
                  - value: 0
                    color: '#4caf50'
                  - value: 0.22
                    color: '#ff9800'
                  - value: 0.33
                    color: '#f44336'
                show:
                  in_header: false
                  legend_value: false
                  name_in_header: false
              - entity: sensor.SYSTEM_NAME_current_electricity_price
                name: Aktuell
                unit: EUR/kWh
                float_precision: 4
                type: line
                stroke_width: 0
                show:
                  in_header: true
                  legend_value: true
                  name_in_header: true
      - type: grid
        cards:
          - type: heading
            heading: Stromkosten
            heading_style: title
            icon: mdi:account-arrow-right-outline
            grid_options:
              columns: 6
              rows: 1
          - type: heading
            icon: mdi:account-arrow-left-outline
            heading: Einspeisung
            heading_style: title
            grid_options:
              columns: 6
              rows: 1
          - type: statistic
            entity: sensor.SYSTEM_NAME_electricity_cost
            period:
              calendar:
                period: day
            stat_type: change
            name: Heute
            icon: mdi:transmission-tower-import
          - type: statistic
            entity: sensor.SYSTEM_NAME_feed_in_revenue
            period:
              calendar:
                period: day
            stat_type: change
            name: Heute
          - type: statistic
            entity: sensor.SYSTEM_NAME_electricity_cost
            period:
              calendar:
                period: month
            stat_type: change
            name: Dieser Monat
            icon: mdi:transmission-tower-import
          - type: statistic
            entity: sensor.SYSTEM_NAME_feed_in_revenue
            period:
              calendar:
                period: month
            stat_type: change
            name: Dieser Monat
          - type: statistic
            entity: sensor.SYSTEM_NAME_electricity_cost
            period:
              calendar:
                period: year
            stat_type: change
            name: Dieses Jahr
            icon: mdi:transmission-tower-import
          - type: statistic
            entity: sensor.SYSTEM_NAME_feed_in_revenue
            period:
              calendar:
                period: year
            stat_type: change
            name: Dieses Jahr
      - type: grid
        cards:
          - type: heading
            heading: Stromkosten & Einspeisevergütung
            heading_style: title
          - type: vertical-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:button-card
                    name: Tag
                    entity: input_select.stromkosten_zeitspanne
                    tap_action:
                      action: call-service
                      service: input_select.select_option
                      service_data:
                        entity_id: input_select.stromkosten_zeitspanne
                        option: Täglich
                    styles:
                      card:
                        - background-color: |
                            [[[
                              return states['input_select.stromkosten_zeitspanne'].state === 'Täglich'
                                ? 'var(--primary-color)' : 'var(--card-background-color)';
                            ]]]
                  - type: custom:button-card
                    name: Woche
                    entity: input_select.stromkosten_zeitspanne
                    tap_action:
                      action: call-service
                      service: input_select.select_option
                      service_data:
                        entity_id: input_select.stromkosten_zeitspanne
                        option: Wöchentlich
                    styles:
                      card:
                        - background-color: |
                            [[[
                              return states['input_select.stromkosten_zeitspanne'].state === 'Wöchentlich'
                                ? 'var(--primary-color)' : 'var(--card-background-color)';
                            ]]]
                  - type: custom:button-card
                    name: Monat
                    entity: input_select.stromkosten_zeitspanne
                    tap_action:
                      action: call-service
                      service: input_select.select_option
                      service_data:
                        entity_id: input_select.stromkosten_zeitspanne
                        option: Monatlich
                    styles:
                      card:
                        - background-color: |
                            [[[
                              return states['input_select.stromkosten_zeitspanne'].state === 'Monatlich'
                                ? 'var(--primary-color)' : 'var(--card-background-color)';
                            ]]]
                  - type: custom:button-card
                    name: Jahr
                    entity: input_select.stromkosten_zeitspanne
                    tap_action:
                      action: call-service
                      service: input_select.select_option
                      service_data:
                        entity_id: input_select.stromkosten_zeitspanne
                        option: Jährlich
                    styles:
                      card:
                        - background-color: |
                            [[[
                              return states['input_select.stromkosten_zeitspanne'].state === 'Jährlich'
                                ? 'var(--primary-color)' : 'var(--card-background-color)';
                            ]]]
              - type: conditional
                conditions:
                  - entity: input_select.stromkosten_zeitspanne
                    state: Täglich
                card:
                  type: statistics-graph
                  title: Stromkosten & Einspeisevergütung – Täglich
                  chart_type: bar
                  period: day
                  days_to_show: 7
                  stat_types:
                    - change
                  entities:
                    - entity: sensor.SYSTEM_NAME_electricity_cost
                      name: Stromkosten
                    - entity: sensor.SYSTEM_NAME_feed_in_revenue
                      name: Einspeisevergütung
              - type: conditional
                conditions:
                  - entity: input_select.stromkosten_zeitspanne
                    state: Wöchentlich
                card:
                  type: statistics-graph
                  title: Stromkosten & Einspeisevergütung – Wöchentlich
                  chart_type: bar
                  period: week
                  days_to_show: 28
                  stat_types:
                    - change
                  entities:
                    - entity: sensor.SYSTEM_NAME_electricity_cost
                      name: Stromkosten
                    - entity: sensor.SYSTEM_NAME_feed_in_revenue
                      name: Einspeisevergütung
              - type: conditional
                conditions:
                  - entity: input_select.stromkosten_zeitspanne
                    state: Monatlich
                card:
                  type: statistics-graph
                  title: Stromkosten & Einspeisevergütung – Monatlich
                  chart_type: bar
                  period: month
                  days_to_show: 180
                  stat_types:
                    - change
                  entities:
                    - entity: sensor.SYSTEM_NAME_electricity_cost
                      name: Stromkosten
                    - entity: sensor.SYSTEM_NAME_feed_in_revenue
                      name: Einspeisevergütung
              - type: conditional
                conditions:
                  - entity: input_select.stromkosten_zeitspanne
                    state: Jährlich
                card:
                  type: statistics-graph
                  title: Stromkosten & Einspeisevergütung – 3-Jahres-Übersicht
                  chart_type: bar
                  period: year
                  days_to_show: 1095
                  stat_types:
                    - change
                  entities:
                    - entity: sensor.SYSTEM_NAME_electricity_cost
                      name: Stromkosten
                    - entity: sensor.SYSTEM_NAME_feed_in_revenue
                      name: Einspeisevergütung

              # Per-consumer cost breakdown — reacts to the same input_select
              # switcher above. Sum of the four bars equals the total
              # `Stromkosten` bar at the corresponding period.
              - type: conditional
                conditions:
                  - entity: input_select.stromkosten_zeitspanne
                    state: Täglich
                card:
                  type: statistics-graph
                  title: Verbraucher-Kosten – Täglich
                  chart_type: bar
                  period: day
                  days_to_show: 7
                  stat_types:
                    - change
                  entities:
                    - entity: sensor.SYSTEM_NAME_heat_pump_cost
                      name: Wärmepumpe
                    - entity: sensor.SYSTEM_NAME_ev_charger_cost
                      name: Wallbox
                    - entity: sensor.SYSTEM_NAME_household_cost
                      name: Haushalt
                    - entity: sensor.SYSTEM_NAME_ac_cost
                      name: Klimaanlage
              - type: conditional
                conditions:
                  - entity: input_select.stromkosten_zeitspanne
                    state: Wöchentlich
                card:
                  type: statistics-graph
                  title: Verbraucher-Kosten – Wöchentlich
                  chart_type: bar
                  period: week
                  days_to_show: 28
                  stat_types:
                    - change
                  entities:
                    - entity: sensor.SYSTEM_NAME_heat_pump_cost
                      name: Wärmepumpe
                    - entity: sensor.SYSTEM_NAME_ev_charger_cost
                      name: Wallbox
                    - entity: sensor.SYSTEM_NAME_household_cost
                      name: Haushalt
                    - entity: sensor.SYSTEM_NAME_ac_cost
                      name: Klimaanlage
              - type: conditional
                conditions:
                  - entity: input_select.stromkosten_zeitspanne
                    state: Monatlich
                card:
                  type: statistics-graph
                  title: Verbraucher-Kosten – Monatlich
                  chart_type: bar
                  period: month
                  days_to_show: 180
                  stat_types:
                    - change
                  entities:
                    - entity: sensor.SYSTEM_NAME_heat_pump_cost
                      name: Wärmepumpe
                    - entity: sensor.SYSTEM_NAME_ev_charger_cost
                      name: Wallbox
                    - entity: sensor.SYSTEM_NAME_household_cost
                      name: Haushalt
                    - entity: sensor.SYSTEM_NAME_ac_cost
                      name: Klimaanlage
              - type: conditional
                conditions:
                  - entity: input_select.stromkosten_zeitspanne
                    state: Jährlich
                card:
                  type: statistics-graph
                  title: Verbraucher-Kosten – 3-Jahres-Übersicht
                  chart_type: bar
                  period: year
                  days_to_show: 1095
                  stat_types:
                    - change
                  entities:
                    - entity: sensor.SYSTEM_NAME_heat_pump_cost
                      name: Wärmepumpe
                    - entity: sensor.SYSTEM_NAME_ev_charger_cost
                      name: Wallbox
                    - entity: sensor.SYSTEM_NAME_household_cost
                      name: Haushalt
                    - entity: sensor.SYSTEM_NAME_ac_cost
                      name: Klimaanlage
