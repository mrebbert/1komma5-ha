[project]
name = "onekommafive"
version = "0.0.0"  # version is tracked in custom_components/onekommafive/manifest.json
description = "Home Assistant custom integration for the 1KOMMA5° Heartbeat platform"
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.setuptools]
# This is a Home Assistant custom component, not a normal pip-installable package.
# Tell setuptools that the project ships zero Python packages so the editable
# install used by CI doesn't fail when it sees dashboard/ and custom_components/
# alongside each other.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-length is enforced by the formatter; ruff sometimes can't break
    "B008",  # function-call-in-default — used intentionally for HA defaults
    "SIM108", # ternary-vs-if — explicit ifs are often clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine
