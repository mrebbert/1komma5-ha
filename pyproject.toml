[project]
# This package name is metadata only — we ship zero importable packages
# (see [tool.setuptools] below).  We avoid the pypi name `onekommafive`
# because that conflicts with the API library we depend on at runtime.
name = "onekommafive-ha"
version = "0.0.0"  # version is tracked in custom_components/onekommafive/manifest.json
description = "Home Assistant custom integration for the 1KOMMA5° Heartbeat platform"
requires-python = ">=3.13"

[project.optional-dependencies]
# Tier-1 unit tests for pure helpers (no HA dependency).
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

# Tier-2 integration tests against a real HA instance.  Heavyweight — the
# plugin pulls in homeassistant itself, pinned to a specific version.
# pytest-cov and pytest are NOT listed here because
# pytest-homeassistant-custom-component pins both to exact versions that
# would conflict with the Tier-1 floor.  The plugin brings them itself.
test-integration = [
    # Pin to the latest known-good version: a loose `>=` makes the resolver
    # back-track over hundreds of older releases (some of which pull in
    # pre-Python-3.13 numpy wheels that fail to build).
    "pytest-homeassistant-custom-component==0.13.316",
    "onekommafive>=0.1.21",
]

[tool.setuptools]
# This is a Home Assistant custom component, not a normal pip-installable package.
# Tell setuptools that the project ships zero Python packages so the editable
# install used by CI doesn't fail when it sees dashboard/ and custom_components/
# alongside each other.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
# pytest-homeassistant-custom-component ships pytest-asyncio; auto-mode lets
# `async def test_…` functions run without an explicit @pytest.mark.asyncio.
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-length is enforced by the formatter; ruff sometimes can't break
    "B008",  # function-call-in-default — used intentionally for HA defaults
    "SIM108", # ternary-vs-if — explicit ifs are often clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine
